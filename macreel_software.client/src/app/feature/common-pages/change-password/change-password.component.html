<div class="min-h-screen flex items-center justify-center bg-[#f6f7fb] px-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-6">

    <!-- Header -->
    <div class="mb-6 text-center bg-[#bc1a31]">
      <h2 class="text-xl font-semibold text-gray-800">🔒 Change Password</h2>
      <p class="text-sm text-gray-500 mt-1">
        Keep your account secure by updating your password
      </p>
    </div>

    <!-- Form -->
    <form class="space-y-4">

      <!-- Current Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Current Password
        </label>
        <input type="password"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          placeholder="Enter current password" />
      </div>

      <!-- New Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          New Password
        </label>
        <input type="password"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          placeholder="Enter new password" />
        <p class="text-xs text-gray-400 mt-1">
          Minimum 8 characters, include a number
        </p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Confirm New Password
        </label>
        <input type="password"
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          placeholder="Re-enter new password" />
      </div>

      <!-- Button -->
      <button type="submit"
        class="w-full mt-4 bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">
        Update Password
      </button>

      <!-- Cancel -->
      <div class="text-center">
        <a href="#" class="text-sm text-gray-500 hover:text-gray-700">
          Cancel
        </a>
      </div>

    </form>
  </div>
</div>
